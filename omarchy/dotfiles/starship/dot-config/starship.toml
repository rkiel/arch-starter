add_newline = true
command_timeout = 200

format = "${custom.repo_root}$git_branch$git_status$line_break${custom.current_dir}$character"

[line_break]
disabled = false

[custom.repo_root]
command = 'basename "$(git rev-parse --show-toplevel)"'
when = true
require_repo = true
shell = ["sh"]
format = '[$output]($style) '
style = "bold blue"

[custom.current_dir]
command = 'prefix=$(git rev-parse --show-prefix 2>/dev/null) && [ -z "$prefix" ] && printf "." || basename "$PWD"'
when = true
shell = ["sh"]
format = '[/$output]($style) '
style = "bold blue"

[directory]
format = '[$path]($style) '
style = "bold blue"
truncation_length = 1
truncation_symbol = "/"

[git_branch]
format = "[$branch]($style) "
style = "bold cyan"
symbol = ""

[git_status]
format = '[\[ $all_status$ahead_behind\]]($style) '
style = "bold yellow"
conflicted = "= "
ahead = "A${count} "
behind = "B${count} "
diverged = "A${ahead_count}/B${behind_count} "
up_to_date = ""
untracked = "[UNTRACKED ](bold blue)"
stashed = "$ "
modified = "[MODIFIED ](bold red)"
staged = "[STAGED ](bold green)"
renamed = "[RENAMED ](bold red)"
deleted = "[DELETED ](bold red)"

[character]
success_symbol = '[\$](bold cyan)'
error_symbol = '[\$](bold red)'
